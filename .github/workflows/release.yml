# SPDX-License-Identifier: GPL-3.0-only

# Maintains a release PR on `dev` from Conventional Commits (version bump in Cargo.toml and
# Cargo.lock, CHANGELOG.md). Merging that PR tags `vX.Y.Z` and publishes a GitHub release.
#
# Uses the RELEASE_PLEASE_TOKEN secret (a PAT) instead of GITHUB_TOKEN: pull requests opened
# with GITHUB_TOKEN don't trigger workflows, so the release PR would never get the required
# `CI` check. Fine-grained PAT scoped to this repo needs:
#   Contents: read & write, Pull requests: read & write, Issues: read & write (labels).

name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One release-please run at a time; later pushes queue behind it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
