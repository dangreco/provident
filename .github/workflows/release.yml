# SPDX-License-Identifier: GPL-3.0-only

# Release flow (`dev` is integration, `main` is production):
#
#   push to dev ─▶ Release Please ─┬─ no release: open/update the release PR on `dev`
#                                  └─ release PR merged: tag vX.Y.Z + GitHub release
#                                        ├─▶ Promote: fast-forward `main` to that tag
#                                        ├─▶ Publish: upload `provident` to crates.io
#                                        └─▶ Wheels ─▶ PyPI: upload `provident` to PyPI
#
# Release Please derives the version bump (Cargo.toml, Cargo.lock) and CHANGELOG.md from
# Conventional Commits; the Python package takes its version from Cargo.toml, so both registries
# get the same version. `main` only ever moves to a released commit, and only forward: if it
# has diverged from `dev`, promotion fails instead of rewriting it.
#
# Both registries use trusted publishing (OIDC), so no long-lived upload tokens are stored. PyPI
# needs a trusted publisher for project `provident`: this repository, workflow `release.yml`,
# environment `pypi`.
#
# Authenticates as the `dangreco-release` GitHub App instead of GITHUB_TOKEN: pull requests
# opened with GITHUB_TOKEN don't trigger workflows, so the release PR would never get the
# required `CI` check. Each job mints a short-lived installation token from two secrets:
#   RELEASE_APP_CLIENT_ID    the app's Client ID
#   RELEASE_APP_PRIVATE_KEY  a private key generated for the app
# The app must be installed on this repository with Contents, Pull requests and Issues
# (labels) set to read & write. If `main` is protected, the app must be allowed to push to it.

name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One release run at a time; later pushes queue behind it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    name: Promote to main
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Fast-forward only, via the API: creates `main` on the first release, and refuses
      # (422) to move it if `main` is not an ancestor of the released commit.
      - name: Fast-forward main to ${{ needs.release-please.outputs.tag }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          tagged=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if [[ $tagged != "$SHA" ]]; then
            echo "::error::$TAG points at $tagged, expected released commit $SHA"
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/heads/main" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$REPO/git/refs/heads/main" -f sha="$SHA" -F force=false
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref=refs/heads/main -f sha="$SHA"
          fi
          echo "main → $TAG ($SHA)" >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted publishing: crates.io exchanges this job's OIDC token for a short-lived
      # publish token, so no long-lived CARGO_REGISTRY_TOKEN secret is needed.
      id-token: write
      # cache-nix-action purges old Nix caches.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cargo-cache-key: publish

      - name: crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked -p provident

  wheels:
    name: Wheels
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.release-please.outputs.tag }}

  pypi:
    name: Publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/provident/
    permissions:
      # Trusted publishing: PyPI exchanges this job's OIDC token for a short-lived upload token.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
