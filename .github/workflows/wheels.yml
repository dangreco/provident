# SPDX-License-Identifier: GPL-3.0-only

# Builds the `provident` Python distributions: one abi3 wheel (CPython ≥ 3.11) per platform,
# plus the sdist, uploaded as `wheels-*` artifacts. Called by `release.yml` before publishing;
# run it by hand (Actions → Wheels) to check every platform still builds without releasing.
#
# Each wheel that can run on its runner is installed and smoke-tested with the offline suite.
# Linux wheels link OpenSSL statically (`vendored-openssl`), so they don't depend on the host's
# libssl; macOS and Windows use the platform TLS stack.

name: Wheels

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering commit).
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28", test: true }
          - { name: manylinux aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28", test: true }
          - { name: musllinux x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { name: musllinux aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { name: macOS arm64, runner: macos-latest, target: aarch64, test: true }
          - { name: macOS x86_64, runner: macos-latest, target: x86_64, test: false }
          - { name: Windows x64, runner: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.99.1"
          args: --release --locked --out dist ${{ runner.os == 'Linux' && '--features vendored-openssl' || '' }}
          # Building OpenSSL from source needs Perl modules the manylinux/musllinux images lack.
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y perl-IPC-Cmd perl-Time-Piece
            elif command -v apk >/dev/null; then
              apk add --no-cache perl make
            fi

      - name: Set up Python
        if: ${{ matrix.test }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # From a copy of the tests outside the checkout, so `import provident` resolves to the
      # installed wheel rather than the source tree (which has no compiled extension).
      - name: Smoke test
        if: ${{ matrix.test }}
        shell: bash
        run: |
          python -m pip install pytest
          # `--no-index`: PyPI also has a `provident`, which must not stand in for this build.
          python -m pip install --no-index --find-links python/dist provident
          cp -r python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests -m "not e2e" -p no:cacheprovider -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.manylinux || 'native' }}-${{ matrix.target }}
          path: python/dist
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: python/dist
          if-no-files-found: error
          retention-days: 7
