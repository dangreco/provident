[package]
name = "provident_python"
description = "Python bindings for provident, published to PyPI as `provident`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Imported as `provident._provident`; the Python package in `python/` re-exports it.
name = "_provident"
crate-type = ["cdylib"]
# Exercised from Python (`make py-test`), not by `cargo test`.
test = false
doctest = false

[features]
# Statically link OpenSSL, for Linux wheels that must not depend on the host's libssl.
# macOS and Windows wheels use the platform TLS stack instead.
vendored-openssl = ["dep:openssl"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# One async core serves both Python clients: `AsyncClient` awaits it on asyncio, `Client`
# blocks on the same tokio runtime with the GIL released.
provident = { path = "..", default-features = false, features = ["async"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311", "chrono"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"], optional = true }
