[package]
name = "provident_tests"
description = "End-to-end tests against the real Provident endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Exactly one of `async` / `blocking`; selects which client mode the e2e tests exercise.
default = ["async"]
async = ["provident/async"]
blocking = ["provident/blocking", "maybe-async/is_sync"]

[dependencies]
dotenvy = "0.15.7"
maybe-async = "0.2.11"
provident = { path = "..", default-features = false }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
