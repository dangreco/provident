[package]
name = "provident_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Exactly one of `async` / `blocking`; selects whether endpoint methods are `async fn`.
default = ["async"]
async = ["provident_http/async"]
blocking = ["provident_http/blocking", "maybe-async/is_sync"]

[dependencies]
maybe-async = "0.2.11"
provident_http = { version = "0.1.0", path = "../http", default-features = false }
provident_models = { version = "0.1.0", path = "../models" }
thiserror = "2.0.21"
