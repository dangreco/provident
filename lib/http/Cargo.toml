[package]
name = "provident_http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# Exactly one of `async` / `blocking` must be enabled; it selects `Client`'s API.
default = ["async"]
async = []
blocking = ["reqwest/blocking"]

[dependencies]
bon = "3.10.2"
# native-tls (OpenSSL): the server only offers TLS 1.2 CBC suites (e.g. ECDHE-RSA-AES256-SHA384),
# which rustls does not implement, so rustls handshakes are reset.
reqwest = { version = "0.13.5", default-features = false, features = [
  "cookies",
  "http2",
  "native-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
url = "2.5.8"
