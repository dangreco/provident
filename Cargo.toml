[package]
name = "provident"
description = "Unofficial client for the Provident (MeterConnex) utility metering portal: meters, usage history, and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/provident"
readme = "README.md"
keywords = ["provident", "meterconnex", "utility", "metering", "energy"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src", "/README.md", "/LICENSE"]

[workspace]
resolver = "3"
members = [".", "python", "tests"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-only"
homepage = "https://github.com/dangreco/provident"
repository = "https://github.com/dangreco/provident"
authors = ["Dan Greco <git@dangre.co>"]

[features]
# Exactly one of `async` / `blocking`; selects whether endpoint methods are `async fn`.
default = ["async"]
async = []
blocking = ["reqwest/blocking", "maybe-async/is_sync"]

[dependencies]
bon = "3.10.2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
maybe-async = "0.2.11"
# native-tls (OpenSSL): the server only offers TLS 1.2 CBC suites (e.g. ECDHE-RSA-AES256-SHA384),
# which rustls does not implement, so rustls handshakes are reset.
reqwest = { version = "0.13.5", default-features = false, features = [
    "cookies",
    "http2",
    "native-tls",
] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
